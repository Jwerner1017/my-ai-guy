[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.3.0"
description = "Aether: a personal AI assistant on Claude with tools, persistent memory and task planning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["anthropic>=2.9,<3", "websockets>=13,<18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aether = "aether.__main__:main"
aether-server = "aether.server:main"

[tool.setuptools]
packages = ["aether"]
